[package]
name = "spotatui"
description = "Terminal music player for Qobuz"
homepage = "https://spotatui.com"
documentation = "https://github.com/LargeModGames/spotatui/tree/main/docs"
repository = "https://github.com/LargeModGames/spotatui"
keywords = ["music-player", "qobuz", "tui", "terminal", "music"]
categories = ["command-line-utilities", "multimedia::audio"]
version = "0.48.0"
authors = ["LargeModGames <LargeModGames@gmail.com>"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
exclude = [
    ".github/demo.gif",
    ".github/workflows",
    ".github/ISSUE_TEMPLATE",
    "target/",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ratatui = { version = "0.30", features = ["crossterm", "layout-cache"], default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "7.0"
clap = { version = "4.6", features = ["cargo"] }
clap_complete = "4.6"
unicode-width = "0.2.2"
unicode-segmentation = { version = "1.12", optional = true }
backtrace = "0.3.76"
crossterm = { version = "0.29", optional = true }
tui-bar-graph = { version = "0.3.3", optional = true }
# Optional because the headless build needs neither half of it: `tui` pulls it
# for the banner gradient and visualizer, `art-decode` for the HSV math in
# `core/cover_theme.rs`.
colorgrad = { version = "0.8.0", optional = true }
tokio = { version = "1.52", features = ["full"] }
rand = "0.10.2"
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.32"
fern = "0.7.1"
open = "5.3"
sha2 = { version = "0.11" }
hex = { version = "0.4" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
openssl = { version = "0.10", optional = true }
cpal = { version = "0.17", optional = true }
realfft = { version = "3.4", optional = true }
discord-rich-presence = { version = "1.1", optional = true }
ratatui-image = { version = "11.1.0", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25", optional = true }
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"], optional = true }
md-5 = { version = "0.11" }
# Subsonic, YouTube and Qobuz stream each track to a tempfile before playing it through the shared
# rodio sink. Also a dev-dependency (used by tests across features).
tempfile = { version = "3" }
# Qobuz transport: the signed-request and key-derivation primitives plus the
# bundle scrape. Same `cipher 0.4` line as librespot, so no graph fork.
base64 = { version = "0.23" }
regex = { version = "1" }
aes = { version = "0.8" }
cbc = { version = "0.1" }
ctr = { version = "0.9" }
hkdf = { version = "0.13" }
# Qobuz progressive delivery: the chunk type of a stream-download source.
bytes = { version = "1" }

# stream-download buffers a byte stream behind a Read+Seek adapter that rodio
# can decode while the download runs. Internet radio uses it on an infinite HTTP
# (ICY) stream, without seeking; Qobuz uses it on its segment transport, with
# seeking. icy-metadata parses in-band StreamTitle now-playing metadata and is
# only compiled under the opt-in `internet-radio` feature.
stream-download = { version = "0.24", default-features = false, features = ["reqwest-rustls"] }

# Local-files media source dependencies
# Local-files audio output. Defaults pull in cpal `playback` plus the common
# codecs (flac/mp3/mp4-aac/vorbis/wav) via symphonia. Drives the default device
# on all three platforms; the macOS gate in `LocalPlayer` is gone since rodio
# 0.22 / cpal 0.17 were measured on CoreAudio. Unrelated to librespot's own
# rodio-backend, which is why librespot keeps portaudio-backend on macOS.
rodio = { version = "0.22" }

# Streaming dependencies: our maintained librespot fork, published on crates.io
# as spotatui-librespot-* (upstream 0.8.0 + CDN 530 fallback for silent playback,
# dealer reconnect/session-loss recovery, OAuth callback listener hardening,
# previous-on-first-track restarting instead of stopping (#366), Spirc ignoring
# play-request ids of direct `Player::load`s so a queued track's end cannot stop
# the next one, a fork-only session disconnect-reason API the app depends on,
# and the SpClient calls of the internal API that replaces the Web API
# - upstream 0.8 cannot be substituted). The `package =` rename keeps `librespot_*` imports and
# `librespot-*/feature` refs unchanged; `=`-pinned so all seven crates upgrade in
# lockstep. See SPOTATUI_FORK.md in the fork repo for the carried patches.
# No default features: the TLS stack is chosen per target below.
futures = "0.3.32"
url = "2.5"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Android has no backend; there the media session's foreground service keeps playback alive.
keepawake = "0.6"

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
pipewire = { version = "0.10", optional = true }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
arboard = { version = "3.4", features = ["wayland-data-control"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
arboard = "3.4"
# On Windows we default to rodio for audio output.
# Without this, librespot-playback falls back to the `pipe` sink which writes raw audio bytes
# to stdout (breaking the TUI and producing no audible output).
smtc-tokio = { version = "0.1.0", optional = true }

# MPRIS D-Bus support (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", optional = true }

# macOS: librespot-playback + Now Playing / Media Key support
# On macOS we use portaudio-backend by default to avoid the pipe sink fallback (which outputs to stdout).
# Rodio has compatibility issues with macOS CoreAudio and Bluetooth devices (AirPods, etc.)
# causing SIGSEGV crashes. See Issue #9 and #20.
[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.4"
objc2-media-player = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["NSImage"] }
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }

[features]
default = ["audio-viz-cpal", "macos-media", "discord-rpc", "mpris", "windows-media", "scripting", "tui"]
# The terminal frontend: gates `mod tui` and owns the terminal-only crates.
# The headless CI leg omits it, so any `crate::tui` import from core/infra/cli
# is a compile error there - that is what keeps a second frontend from silently
# re-coupling to the terminal one.
tui = ["dep:unicode-segmentation", "dep:ratatui", "dep:crossterm", "dep:tui-bar-graph", "dep:colorgrad"]
audio-viz = ["realfft", "pipewire"]
audio-viz-cpal = ["realfft", "cpal"]  # Alternative for Windows/macOS or if pipewire issues
mpris = ["mpris-server"]  # MPRIS D-Bus integration (Linux only)
macos-media = ["objc2-media-player", "objc2-foundation", "objc2-app-kit", "objc2", "block2"]  # macOS Now Playing integration
windows-media = ["smtc-tokio"] # windows SMTC integration
discord-rpc = ["discord-rich-presence"]
# The frontend-agnostic decode half of cover art: fetch + `image`-decode into
# the store frontends render from (also feeds the adaptive theme's palette
# extraction). Not meant to be enabled by hand: `cover-art` layers the
# terminal rendering on top.
art-decode = ["dep:image", "dep:colorgrad"]
cover-art = ["tui", "art-decode", "dep:ratatui-image"]
scripting = ["dep:mlua"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_env = "musl")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[lib]
name = "spotatui"
path = "src/lib.rs"

[[bin]]
bench = false
path = "src/bin/spotatui.rs"
name = "spotatui"

[profile.release]
codegen-units = 1  # Better optimization
lto = true         # Link-time optimization
opt-level = "s"    # Prioritize small binary size
strip = true       # Remove debug symbols

[package.metadata.deb]
maintainer = "LargeModGames <LargeModGames@gmail.com>"
copyright = "2025, LargeModGames"
license-file = ["LICENSE", "4"]
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  ["target/release/spotatui", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/spotatui/README", "644"],
]
