on:
  pull_request:
  push:
    branches: [main]

name: Continuous Integration

permissions:
  contents: read

jobs:
  # Workaround for making Github Actions skip based on commit message `[skip ci]`
  # Source https://gist.github.com/ybiquitous/c80f15c18319c63cae8447a3be341267
  prepare:
    runs-on: ubuntu-latest
    if: |
      !contains(format('{0} {1} {2}', github.event.head_commit.message, github.event.pull_request.title, github.event.pull_request.body), '[skip ci]')
    steps:
      # Debug output only. Read the payload from $GITHUB_EVENT_PATH instead of
      # templating ${{ toJson(github.event) }} into the script: expression
      # expansion happens before the shell runs, so attacker-controlled payload
      # fields (PR title/body, commit message) could escape the heredoc and
      # execute (CodeQL: actions/cache-poisoning/code-injection).
      - run: |
          echo "github.event_name: $GITHUB_EVENT_NAME"
          echo "github.event:"
          cat "$GITHUB_EVENT_PATH"

  check:
    name: Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default `cargo run` build: tui, audio-viz-cpal, macos-media,
          # discord-rpc, mpris, windows-media, scripting.
          - name: default
            args: "--locked"
          # Headless: the only leg without `tui`. `mod tui` is feature-gated, so
          # this leg turns any `crate::tui` import from core/infra/cli into a
          # compile error, which is what keeps a second frontend from silently
          # re-coupling to the terminal one.
          - name: headless
            args: "--locked --no-default-features"
    env:
      RUSTFLAGS: "-C linker-features=-lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq pkg-config libssl-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check $ARGS
        env:
          ARGS: ${{ matrix.args }}

  test:
    name: Test Suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: "--locked"
          # See the check job for why the headless leg exists.
          - name: headless
            args: "--locked --no-default-features"
    env:
      RUSTFLAGS: "-C linker-features=-lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # These dependencies are required for the audio backend.
      - run: |
          sudo apt-get update
          sudo apt-get install -y -qq pkg-config libssl-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test $ARGS
        env:
          ARGS: ${{ matrix.args }}

  # Line coverage for Codecov, on the default feature set. The coverage build
  # uses its own instrumentation flags, so it does not share the test job's
  # cache. Fork pull requests have no secret and upload tokenless. A failed
  # upload never turns the job red: coverage is a report, not a gate.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: prepare
    env:
      RUSTFLAGS: "-C linker-features=-lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - run: |
          sudo apt-get update
          sudo apt-get install -y -qq pkg-config libssl-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@db07720855ab1f9adf78d37929621da20c5775a4 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: "--locked"
          # See the check job for why the headless leg exists.
          - name: headless
            args: "--locked --no-default-features"
    env:
      RUSTFLAGS: "-C linker-features=-lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq pkg-config libssl-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy $ARGS -- -D warnings
        env:
          ARGS: ${{ matrix.args }}

  # The src/gates.rs test pins the coupling counters in tools/gates.count to the
  # measured values and holds the adoption counters as floors (gates-floor.yml
  # raises those on main); this
  # job closes the remaining hole by comparing the file against the merge-base,
  # so a PR cannot raise a coupling baseline or lower the test floor alongside
  # the code that would need it. Pull requests only: pushes to main have no base
  # to ratchet against.
  gates-ratchet:
    name: Gates ratchet
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'pull_request'
    steps:
      # Pinned to an immutable SHA per review; the pre-existing jobs' @master
      # refs are a separate hygiene pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare tools/gates.count against merge-base
        run: |
          git fetch origin "${{ github.base_ref }}"
          bash tools/check_gates_ratchet.sh FETCH_HEAD
