name: Gates floor

# Raises the two adoption floors in tools/gates.count (test_attribute_total,
# action_refs_in_tui_handlers) to the measured values after each push to main,
# so a PR that adds tests never edits the file. The build runs with no write
# token in reach; only the commit job, after a fresh checkout, gets
# contents:write and pushes with the repository's own GITHUB_TOKEN (a push made
# with that token starts no further workflow runs).

on:
  push:
    branches: [main]
    # The bot commit touches only this file, so it does not start another run.
    paths-ignore:
      - tools/gates.count

permissions:
  contents: read

# A newer push cancels the older run: the newer run measures the newest main,
# and the older run would only be rejected as non-fast-forward at the push.
concurrency:
  group: gates-floor
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      counts: ${{ steps.result.outputs.counts }}
    env:
      RUSTFLAGS: "-C linker-features=-lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq pkg-config libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libpipewire-0.3-dev libspa-0.2-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Measure the counters and raise the floors
        env:
          GATES_BLESS: "1"
        run: cargo test --locked --no-default-features --features tui --lib gates::ratchet_counters_match_the_checked_in_baselines
      - id: result
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "counts=$(base64 -w0 tools/gates.count)" >> "$GITHUB_OUTPUT"

  commit:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.measure.outputs.sha }}
          persist-credentials: false
      - name: Apply the measured floors
        id: apply
        env:
          COUNTS: ${{ needs.measure.outputs.counts }}
        run: |
          printf '%s' "$COUNTS" | base64 -d > tools/gates.count
          if git diff --quiet; then
            echo "The floors are current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff
          bash tools/check_gates_ratchet.sh HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(gates): raise the adoption floors [skip ci]" -- tools/gates.count
          # A non-fast-forward rejection means main moved during the run: the
          # run for the newer commit raises the floors instead.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
