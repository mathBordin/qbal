version: 2
updates:
  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 10
    ignore:
      # The Qobuz stream decryption is written against the `cipher 0.4` crate
      # family; moving to cipher 0.5 is a code change, not a version bump.
      - dependency-name: "aes"
        versions: [">=0.9"]
      - dependency-name: "cbc"
        versions: [">=0.2"]
      - dependency-name: "ctr"
        versions: [">=0.10"]
      # tui-bar-graph takes a colorgrad 0.8 `Gradient`; lift this when it moves.
      - dependency-name: "colorgrad"
        versions: [">=0.9"]
    groups:
      # Group minor/patch updates to reduce noise
      rust-minor-updates:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
