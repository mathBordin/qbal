# Example Qbal config.yml (~/.config/qbal/config.yml). Every field is
# optional: leave anything out to keep its default. Invalid values log a
# warning and fall back to the default.
# Full reference: docs/configuration.md

behavior:
  # auto follows the system locale; or en, pt-BR, fr
  language: auto

  # --- Qobuz ---
  qobuz_quality: 6 # 5 = MP3 320, 6 = FLAC 16/44.1, 7 = FLAC 24/96, 27 = FLAC 24/192

  # --- Timing ---
  seek_milliseconds: 5000
  volume_increment: 10            # 0..=100
  status_message_ttl_percent: 100 # 10..=1000; 200 = messages stay twice as long
  table_scroll_padding: 5         # rows kept visible below the cursor

  # --- Startup ---
  startup_route: home            # home | stats
  startup_behavior: continue     # continue | play | pause

  # --- Toggles ---
  enable_lyrics: true
  enable_media_keys: true
  enable_discord_rpc: true
  disable_mouse_inputs: false

  # --- Sorting ("<field>" or "<field>:desc") ---
  # default | name | artist | album | duration | release_date
  default_sort_playlist_tracks: default

  # --- Layout ---
  sidebar_position: left     # left | right | hidden
  playbar_position: bottom   # bottom | top
  small_terminal_width: 150
  small_terminal_height: 45

  # --- Visualizer ---
  # Cava | BarGraph | HeadUnit | AnalogVu | Winamp | PhosphorScope | Outrun | RackEq | Cassette
  visualizer_style: Cava

  # --- Cover art (needs the cover-art build feature) ---
  # draw_cover_art_forced: true            # draw with characters on basic terminals
  # cover_art_theme: true                  # tint the interface with the cover's colours
  # cover_art_dither: true                 # two-colour dithered cover
  # cover_art_dither_algorithm: stucki     # stucki | bayer8x8 | atkinson
  # cover_art_dither_pixel_scale: 1        # 1..=3

  # --- Icons ---
  # All but list_highlight_icon must be exactly one terminal column wide.
  playing_icon: "▶"
  gauge_filled_icon: "⣿"
  gauge_unfilled_icon: "⣉"
  sort_ascending_icon: "↑"
  sort_descending_icon: "↓"
  list_highlight_icon: "▶"

  # --- Playbar button labels ---
  # playbar_control_labels:
  #   prev: "⏮"
  #   play_pause: "[PLAY/PAUSE]"
  #   next: "⏭"
  #   shuffle: "shfl"
  #   repeat: "rpt"
  #   vol_down: "vol-"
  #   vol_up: "vol+"

# theme:
#   preset: "Default (Cyan)"
#   cover_art_dither_color: auto             # or '120, 160, 220'

# --- Templates ---
# playbar_status keys: state, source, queue, shuffle, repeat, volume
#   ({queue}, {shuffle} and {repeat} bring their own " | Label: " prefix)
# window_title keys: title, artist ({artist} brings its own " — ")
format:
  playbar_status: "{state} ({source}{queue}{shuffle}{repeat} | Volume: {volume}%)"
  window_title: "{title}{artist}"

# --- Track list columns ---
# ids: index, title, artist, album, length, year
tables:
  songs:
    - { id: title, width_percent: 40 }
    - { id: artist, header: "Band", width_percent: 30 }
    - { id: album }
    - { id: length }
